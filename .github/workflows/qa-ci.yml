name: Cynbit QA Automation Regression CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  qa-regression:
    name: Run Automated QA Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Live Regression Tests
        run: |
          python automated_qa_suite.py || true

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-results
          path: qa_automation_results.json
